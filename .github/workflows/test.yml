name: Test

# The gate. Runs once on every pushed commit, on every branch, and is called by
# release.yml before it builds an image - so the thing that blocks a production
# deploy is definitionally the same thing you see on every push, not a second
# copy that can drift.
#
# `push` is the ONLY commit trigger, and `branches: ['**']` matches every branch
# and no tag. One trigger means one run per commit. There is deliberately no
# `pull_request` here, which is worth explaining because dropping it is the
# unusual choice:
#
#   The textbook reason to keep `pull_request` is that it tests the ephemeral
#   merge commit of the branch with its base, which a branch-tip `push` run never
#   sees. In this repository that distinction is empty. `main` is a pure
#   promotion pointer: its only commits are merges from `develop`, and it carries
#   no content of its own, so the tree of a develop->main merge commit is
#   byte-identical to the tree of develop's tip. The two runs compile the same
#   code. (Verified: HEAD of main and the develop commit it merged share tree
#   92366892.) The day a hotfix lands directly on main, that stops being true and
#   `pull_request` earns its place back - see below.
#
#   The other reason is fork coverage: `push` never fires in this repository for
#   a PR opened from a fork. There is no such path today - the repository is
#   private with no forks. Going public or taking outside contributors is the
#   other event that brings `pull_request` back, and it is `pull_request_target`
#   and secret exposure that need thinking about at that point.
#
# What this replaced, and why narrowing `push` was not enough: the file used to
# carry `push: branches: ['**']` AND `pull_request`, and every commit ran it
# twice. Narrowing `push` to [main, develop] does not fix that, because the
# workflow here is a long-lived `develop` -> `main` promotion PR - `develop` is
# simultaneously the PR head and a listed push branch, so both triggers still
# fire. Nor do the two runs cancel each other: the concurrency group below keys
# on github.ref, which is `refs/heads/develop` for one and `refs/pull/N/merge`
# for the other. Removing a trigger is the only thing that actually deduplicates.
#
# No continue-on-error anywhere in this file. It is allowed to be red only when
# the repository is broken - see the `migrations` job, which is red today for a
# reason recorded there.
on:
  push:
    branches: ['**']
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches `FROM dunglas/frankenphp:1-php8.4` in the Dockerfile and .php-version.
  # CI is only
  # a gate if it runs the same interpreter as production; if the Dockerfile's
  # base image moves, this moves with it.
  PHP_VERSION: '8.4'

jobs:
  # One job for every fast check, sharing a single composer install. Splitting
  # `composer validate` and two lint commands into separate jobs would cost more
  # in repeated install time than the parallelism buys.
  #
  # Order is compile, then lint, then tests: a container that does not compile
  # is not worth linting, and a step that runs first cannot be hidden behind an
  # earlier failure.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    # Real environment variables win over .env/.env.local, so these pin what the
    # checks resolve instead of inheriting the dev defaults committed in .env
    # (a postgres DATABASE_URL, an empty APP_SECRET). Nothing here connects to a
    # database - the value only has to parse.
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ci
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/paysub?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: 'amqp://guest:guest@127.0.0.1:5672/%2f/messages'
      MAILER_DSN: 'null://null'
      JSON_HUB_PROJECT: '00000000-0000-0000-0000-000000000000'
      MAILING_PROVIDER_ROUTING_KEY: 'ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # The set the Dockerfile builds: amqp via pecl, then pdo_mysql, opcache
          # and intl via docker-php-ext-install. opcache is omitted here - it
          # changes nothing a lint or a test can observe.
          extensions: amqp, ctype, iconv, intl, pdo_mysql
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # The compile check, and the most valuable one this repository has. The app
      # resolves 14 environment variables through %env()%, binds
      # $jsonHubProjectUuid, $systemEmail, $contactEmail and $docsPath by
      # autowiring, and injects %env(bool:MAINTENANCE_MODE)% into
      # MaintenanceKernelRequestSubscriber via #[Autowire]. A container that does
      # not compile is a 500 on every route, which is exactly what a deploy most
      # needs caught before it ships.
      - name: Lint the service container
        run: php bin/console lint:container

      - name: Validate composer.json
        # --strict is omitted on purpose: this is a `type: project` package with
        # no name or description, which --strict rejects, and neither is a defect
        # for something that is never published. --no-check-publish covers that.
        run: composer validate --no-check-publish

      - name: Lint YAML
        run: php bin/console lint:yaml config translations

      # There is no `lint:twig` step. It cannot run in this dependency set at
      # all: doctrine/doctrine-migrations-bundle registers a Twig namespace for a
      # Resources/views directory it does not ship, and Twig's FilesystemLoader
      # throws on the missing path before it looks at a single template. The
      # failure is in the bundle, not in templates/, so gating on it would block
      # releases for something this repository cannot fix. It is parked in
      # quality.yml instead, where its red is visible without being fatal.

      # PHPUnit has its own job (`phpunit`) below: the test suite now contains
      # functional tests that need a database, so it cannot run here where no
      # service container is available. The separation keeps this job fast and
      # dependency-free.
      #
      # The API v1 release gates live in their own job (`release-gates`) below:
      # production dependency resolution, route listing, OpenAPI export and
      # contract validation, and a DB-less runtime smoke of the prod container.
      # The blocking behavioral gates (contract, two-User isolation, OAuth2
      # security, report parity, web login) run as PHPUnit tests in `phpunit`.

  # API v1 release gates (issue #100). DB-less by design: every check here
  # proves something about the built artifact, not about data. Needs-a-
  # database gates stay where they belong - the `phpunit` suite (contract,
  # isolation, OAuth2 token flows, report parity, web login) and the
  # `migrations` job (production migration replay plus schema validation).
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest

    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ci
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/paysub?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: 'amqp://guest:guest@127.0.0.1:5672/%2f/messages'
      MAILER_DSN: 'null://null'
      JSON_HUB_PROJECT: '00000000-0000-0000-0000-000000000000'
      MAILING_PROVIDER_ROUTING_KEY: 'ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: amqp, ctype, iconv, intl, pdo_mysql
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # base.html.twig requires the compiled asset; without this the runtime
      # smoke below 500s on every page render, same as the Dockerfile build
      # step and the other jobs that boot a real page.
      - name: Build Tailwind CSS
        run: php bin/console tailwind:build

      # The Dockerfile builds the production image from the same lockfile, so
      # a resolution that only works with dev packages ships a broken image.
      - name: Verify production dependency resolution
        run: |
          composer check-platform-reqs --no-dev
          composer install --no-dev --dry-run --no-interaction --no-progress

      - name: Compile the production container
        run: php bin/console lint:container --env=prod

      # Graduated from quality.yml's waiting room (issue #100): the mapping
      # is green and stays green, so it is a gate now, not a watcher.
      # --skip-sync on purpose, same as before: mapping coherence needs no
      # database. Whether the migrated schema matches is answered by the
      # `migrations` job's full validate against a real server.
      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync --env=prod

      # Every route the v1 contract documents must exist, and the OAuth2
      # discovery/token surface must be registered. A renamed route that the
      # contract still names is a 404 behind a 200-documented operation.
      - name: Verify v1 and discovery routes
        run: |
          routes=$(php bin/console debug:router --env=prod)
          for name in \
            api_v1_expense_categories_list api_v1_expense_categories_create \
            api_v1_expense_categories_show api_v1_expense_categories_update \
            api_v1_expense_categories_delete \
            api_v1_subscriptions_list api_v1_subscriptions_create \
            api_v1_subscriptions_show api_v1_subscriptions_update \
            api_v1_subscriptions_delete \
            api_v1_reports_dashboard api_v1_openapi \
            oauth_discovery_authorization_server \
            oauth_discovery_protected_resource oauth_discovery_jwks \
            oauth2_authorize oauth2_token; do
            echo "$routes" | grep -q " $name " || { echo "::error::route $name is missing"; exit 1; }
          done
          echo "all v1 and discovery routes are registered"

      # Proves the API Platform wiring still exports (the /api entrypoint and
      # docs the firewall guards), and that the committed v1 contract - the
      # reviewed artifact OpenApiContractTest locks - parses at v1.0.0 with
      # every operation it claims.
      - name: Export and validate OpenAPI
        run: |
          php bin/console api:openapi:export --output=/tmp/api-platform.json --env=prod
          php bin/console debug:router --env=prod --show-controllers > /dev/null
          php -r '$p=json_decode(file_get_contents("/tmp/api-platform.json"),true); if (!is_array($p)||!isset($p["openapi"],$p["info"])) {fwrite(STDERR,"platform export is not OpenAPI\n"); exit(1);} echo "platform export: ",$p["openapi"]," ",$p["info"]["title"] ?? "?","\n";'
          php -r '$c=json_decode(file_get_contents("resources/openapi/v1.json"),true); if (!is_array($c)||"3.0.3"!==($c["openapi"]??null)||"1.0.0"!==($c["info"]["version"]??null)||0===count($c["paths"]??[])) {fwrite(STDERR,"v1 contract invalid\n"); exit(1);} echo "v1 contract: 1.0.0, ",count($c["paths"])," paths\n";'

      # Boots the real prod container over HTTP with ephemeral keys and proves
      # the unauthenticated surface behaves: discovery documents serve, the
      # JWKS carries a key, the API answers 401 with a problem document
      # instead of an HTML error, and web login still renders its form.
      # Authenticated flows (issuance, read, refresh, revocation) need a
      # provisioned client and User, so they stay in the blocking PHPUnit
      # suite rather than here.
      #
      # -d variables_order=EGPCS is load-bearing: PHP's built-in server does
      # not populate $_SERVER from the process environment, and Symfony reads
      # %env()% from $_SERVER first - without it the server would boot on
      # .env defaults and the smoke would prove nothing.
      - name: Runtime smoke of the prod container
        run: |
          mkdir -p /tmp/oauth-smoke
          openssl genrsa -out /tmp/oauth-smoke/private.pem 2048
          openssl rsa -in /tmp/oauth-smoke/private.pem -pubout -out /tmp/oauth-smoke/public.pem
          export OAUTH_PRIVATE_KEY=/tmp/oauth-smoke/private.pem
          export OAUTH_PUBLIC_KEY=/tmp/oauth-smoke/public.pem
          export OAUTH_ENCRYPTION_KEY=$(openssl rand -hex 32)
          export OAUTH2_ISSUER=http://127.0.0.1:8123
          php -d variables_order=EGPCS -S 127.0.0.1:8123 -t public > /tmp/smoke-server.log 2>&1 &
          echo $! > /tmp/smoke-server.pid
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8123/ && break
            sleep 1
            if [ "$i" = "30" ]; then echo "::error::smoke server did not start"; cat /tmp/smoke-server.log; exit 1; fi
          done
          check() { # $1 = url, $2 = expected status, $3 = body grep
            code=$(curl -s -o /tmp/smoke-body -w '%{http_code}' "$1")
            [ "$code" = "$2" ] || { echo "::error::$1 served $code, expected $2"; cat /tmp/smoke-body; exit 1; }
            grep -q "$3" /tmp/smoke-body || { echo "::error::$1 body misses $3"; cat /tmp/smoke-body; exit 1; }
          }
          check http://127.0.0.1:8123/.well-known/oauth-authorization-server 200 authorization_endpoint
          check http://127.0.0.1:8123/.well-known/oauth-protected-resource 200 authorization_servers
          check http://127.0.0.1:8123/.well-known/jwks.json 200 '"kty":"RSA"'
          check http://127.0.0.1:8123/api/v1/openapi.json 401 '"code":"unauthorized"'
          check http://127.0.0.1:8123/login 200 _csrf_token
          echo "runtime smoke passed"

      - name: Stop the smoke server
        if: always()
        run: kill "$(cat /tmp/smoke-server.pid)" || true

  # Functional tests (WebTestCase, ResetDatabase) need a real database to run
  # against. Shares the MySQL service definition with `migrations` below for the
  # same reason documented there: the DSN matches production's serverVersion and
  # the AMQP scheme avoids the Doctrine transport factory's option validation.
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paysub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_SECRET: ci
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/paysub?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: 'amqp://guest:guest@127.0.0.1:5672/%2f/messages'
      MAILER_DSN: 'null://null'
      JSON_HUB_PROJECT: '00000000-0000-0000-0000-000000000000'
      MAILING_PROVIDER_ROUTING_KEY: 'ci'
      # Dummy only: the suite replaces the client with a fake before verifying,
      # but merely rendering /contact instantiates it, which requires a secret.
      GOOGLE_RECAPTCHA_SITE_KEY: 'ci'
      GOOGLE_RECAPTCHA_SECRET: 'ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: amqp, ctype, iconv, intl, pdo_mysql
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # base.html.twig fails to render without this: the Tailwind bundle looks
      # for a pre-built CSS file and does not compile it on the fly here the
      # way a dev-server request does. Same command the Dockerfile runs before
      # a production image is built.
      - name: Build Tailwind CSS
        run: php bin/console tailwind:build

      # The behavioral suite (tests/) needs a database: `when@test` appends
      # `_test` to the database name, so this provisions `paysub_test` and
      # replays the migrations into it, which additionally proves the
      # migrations apply cleanly before a single test boots. Each test then
      # rebuilds its own schema from the entity metadata, so tests stay
      # isolated from each other regardless of this step.
      - name: Prepare the test database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing --allow-no-migration

      # The gate's behavioral core: registration, authentication, contact,
      # newsletter, subscription CRUD with two-user isolation, limits, totals
      # and charts. No continue-on-error anywhere in this file: a red suite
      # blocks the push, the tag build in release.yml, and therefore the
      # deploy.
      - name: Run PHPUnit
        run: vendor/bin/phpunit

  # Its own job because it replays production, not the test setup: the checks
  # above migrate a `paysub_test` database under APP_ENV=test for the
  # behavioral suite, while this job runs the byte-for-byte deploy.yml command
  # under APP_ENV=prod and then loads the fixtures on top, which is what
  # proves the migrated schema still matches the entity mappings well enough
  # to insert into.
  #
  # Why MESSENGER_TRANSPORT_DSN below is an amqp:// URL for a broker that is not
  # running, rather than the doctrine:// one the rest of this file used to carry.
  #
  # config/packages/messenger.yaml gives the `newsletter` transport an AMQP-only
  # `exchange` options block and, since the `async` transport was pinned to a
  # literal doctrine:// DSN, `newsletter` is now the sole reader of that variable.
  # Point it at doctrine:// and the Doctrine transport factory rejects `exchange`:
  #
  #   Unknown option found: [exchange]. Allowed options are [table_name, ...]
  #
  # That fires in any command running Doctrine's schema listener, because the
  # listener instantiates every transport whose scheme is doctrine:// - which is
  # what killed the migrate step below. Of the plausible schemes only doctrine://
  # validates options strictly; in-memory:// and sync:// ignore unknown ones.
  #
  # amqp:// is deliberate over the tolerant in-memory://: it is the scheme
  # production actually uses, so a genuine AMQP option error still surfaces here
  # instead of being swallowed. No broker is needed - the AMQP transport connects
  # lazily and nothing in these steps sends or consumes a message.
  #
  # Still unresolved: the variable is named for messenger at large while only
  # feeding an AMQP-only transport, so a doctrine:// value supplied by habit
  # breaks every schema command again. Renaming it (MAILING_TRANSPORT_DSN) is the
  # actual fix and needs the deploy secret and host env renamed with it.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      mysql:
        # rum runs MySQL 9.7.2 (the shared `my.rum` container), so CI replays
        # against the 9 series. The DSN below still declares serverVersion=8.4,
        # matching what production actually passes - reproducing that mismatch
        # is the point, since it is what selects Doctrine's platform.
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paysub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/paysub?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: 'amqp://guest:guest@127.0.0.1:5672/%2f/messages'
      MAILER_DSN: 'null://null'
      APP_SECRET: ci
      JSON_HUB_PROJECT: '00000000-0000-0000-0000-000000000000'
      MAILING_PROVIDER_ROUTING_KEY: 'ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: amqp, ctype, iconv, intl, pdo_mysql
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # Byte-for-byte the command deploy.yml runs on the host, and under the same
      # APP_ENV=prod the container uses there. --allow-no-migration keeps this
      # honest if the set is ever emptied; --all-or-nothing is what makes a
      # partial failure leave no half-migrated schema behind.
      - name: Replay the production migration command
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
        run: php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing --allow-no-migration

      # APP_ENV=dev, not prod: DoctrineFixturesBundle and ZenstruckFoundryBundle
      # are registered for dev/test only (config/bundles.php). dev is the right
      # one of the two - `when@test` in config/packages/doctrine.yaml appends
      # `_test` to the database name, which would point this at an empty schema
      # and prove nothing.
      - name: Load fixtures onto the migrated schema
        env:
          APP_ENV: dev
        run: php bin/console doctrine:fixtures:load --no-interaction

      # The migrated schema must match the entity mappings exactly. This is
      # the rollback precondition (issue #100): a release rolls back by
      # redeploying the previous image tag against the already-migrated
      # schema, which only works while migrations stay additive - enforced
      # separately by AdditiveMigrationTest in the `phpunit` job. Full
      # validation (with sync) needs the real server above, which is why it
      # lives here and not in `release-gates`.
      - name: Validate migrated schema against mappings
        env:
          APP_ENV: dev
        run: php bin/console doctrine:schema:validate

  # WCAG 2.1 AA axe scan (issue #52). Blocking: fails on any violation.
  # Mirrors docs/accessibility.md local reproduction: test-kernel server via
  # the php -S router, fixture credentials, reCAPTCHA test keys.
  #
  # Restricted to main and to the release gate: this scan is by far the
  # slowest job in the file (Chromium install + a real server boot), and
  # `push: branches: ['**']` above means it would otherwise run on every
  # commit to every feature branch. `develop` -> `main` is a pure promotion
  # (see the header comment), so scanning every intermediate develop push
  # buys nothing a scan of the merge commit on main doesn't already cover.
  # `github.event_name == 'workflow_call'` keeps it in the tag-build gate
  # release.yml drives, where github.ref is refs/tags/vX, not refs/heads/main.
  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_call'

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paysub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/paysub?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: 'amqp://guest:guest@127.0.0.1:5672/%2f/messages'
      MAILER_DSN: 'null://null'
      GOOGLE_RECAPTCHA_SITE_KEY: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI'
      GOOGLE_RECAPTCHA_SECRET: '6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe'
      JSON_HUB_PROJECT: '00000000-0000-0000-0000-000000000000'
      MAILING_PROVIDER_ROUTING_KEY: 'ci'
      BASE_URL: 'http://127.0.0.1:8000'
      A11Y_USER_EMAIL: 'foo@bar.com'
      A11Y_USER_PASSWORD: 'alamakota'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: amqp, ctype, iconv, intl, pdo_mysql
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Build Tailwind CSS
        run: php bin/console tailwind:build

      # APP_ENV=test throughout: `when@test` in doctrine.yaml appends `_test`
      # to the database name, so this targets `paysub_test` — the same database
      # the router-based server below boots against. Mixing envs here (migrate
      # under test, fixtures under dev) would seed `paysub` while the server
      # reads the empty `paysub_test` and every login fails. database:create is
      # explicit because the MySQL service only creates `paysub`.
      # MESSENGER_TRANSPORT_DSN stays amqp:// with no broker: the transport
      # connects lazily and nothing here sends or consumes a message (same
      # reasoning as the `migrations` job above).
      - name: Migrate and load fixtures
        run: |
          APP_ENV=test php bin/console doctrine:database:create --if-not-exists --no-interaction
          APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing --allow-no-migration
          APP_ENV=test php bin/console doctrine:fixtures:load --no-interaction

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/accessibility/package-lock.json

      - name: Install scan dependencies
        working-directory: tests/accessibility
        run: npm ci

      - name: Install Chromium
        working-directory: tests/accessibility
        run: npx playwright install chromium --with-deps

      - name: Start the test-kernel server
        run: |
          APP_ENV=test php -S 127.0.0.1:8000 tests/accessibility/router.php > /tmp/a11y-server.log 2>&1 &
          echo $! > /tmp/a11y-server.pid
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              echo "Server is up."
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "Server failed to start:"
              cat /tmp/a11y-server.log
              exit 1
            fi
          done

      - name: Run the axe WCAG 2.1 AA scan
        working-directory: tests/accessibility
        run: node scan.mjs

      - name: Upload the accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: var/accessibility-report.json

      - name: Stop the test-kernel server
        if: always()
        run: |
          kill "$(cat /tmp/a11y-server.pid)" || true
