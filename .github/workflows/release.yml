name: Release image

# Never add a `pull_request_target` trigger that checks out the PR head (see
# test.yml). This workflow is bound to the `production` environment.
on:
  push:
    tags:
      - 'v*'

# Images go to the private registry on rum rather than ghcr.io: this repository
# is private, the rest of the suite (jsonhub/*, gprodb/pages-api) already
# publishes here, and it keeps the images off GitHub's package storage entirely.
# The registry host is the REGISTRY_HOST variable of the `production`
# environment (see the build-and-push job), not spelled out in the repository.
permissions:
  contents: read

env:
  IMAGE_NAME: paysubscriptions/web

jobs:
  # The gate. The same workflow that runs on every pull request and on `main`,
  # so a tag whose checks are red never produces an image and therefore never
  # reaches deploy.yml.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # REGISTRY_USER and REGISTRY_PASSWORD are scoped to the `production`
    # environment, and environment secrets are invisible to a job that does not
    # name the environment - without this line the login step below would receive
    # two empty strings and the tag would die here having built nothing.
    #
    # The consequence to know about: this also puts the *image build* behind any
    # deployment protection rule (required reviewers, wait timer) later added to
    # the environment. Moving the two registry secrets to repository scope is what
    # would separate "approve the deploy" from "build the image"; see the notes in
    # deploy.yml.
    environment: production
    permissions:
      contents: read
    env:
      REGISTRY: ${{ vars.REGISTRY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The Dockerfile has a single stage (dunglas/frankenphp:1-php8.4), so there
      # is no `target:` to select - unlike the multi-stage images elsewhere in the
      # suite.
      #
      # A single platform: `docker --context rum info` reports x86_64, and
      # building the arm64 half would double the build for an image nothing pulls.
      #
      # The provenance and SBOM attestations ride inside the image index and land
      # in the registry with it. There is deliberately no
      # actions/attest-build-provenance step on top: GitHub's attestation store
      # rejects writes from user-owned private repositories.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    # Required for the reusable workflow to see the production environment's
    # secrets - a called workflow inherits none of them by default.
    secrets: inherit

  # Not in deploy.yml on purpose: deploy.yml also runs by hand to redeploy or
  # to roll back to any tag that already has an image, and neither of those is
  # an API Release - only a tag push that was tested, built and deployed by this
  # workflow may notify the SDK generator, so the dispatch lives here behind
  # `needs: deploy` and manual redeploys and rollbacks never dispatch.
  #
  # Naming the `production` environment is what makes the dispatch secret
  # visible to this job, and it also puts the job behind any wait timer or
  # required reviewers later added to the environment: this job gets its own
  # approval gate, so a reviewer approves the deploy and the dispatch
  # separately, and a timer delays each of them in turn.
  #
  # `deployment: false` keeps this notification from registering as a
  # deployment of `production` - it is not one, the deploy job above is. That
  # opt-out stops working if a custom deployment protection rule is ever added
  # to the environment, so revisit this job when that happens.
  #
  # The target repository must be spelled as its canonical name
  # (lbacik/jsonhub-sdk-generator): the POST below never follows redirects (no
  # `-L`), so a renamed generator would answer 301 and the dispatch would fail
  # instead of landing. If the generator is ever renamed, updating this URL
  # goes on the checklist.
  dispatch-sdk-release:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Dispatch api-release to the SDK generator
        env:
          SDK_GENERATOR_DISPATCH_TOKEN: ${{ secrets.SDK_GENERATOR_DISPATCH_TOKEN }}
          SOURCE_API_VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$SDK_GENERATOR_DISPATCH_TOKEN" ]; then
            echo "::notice::SDK generator dispatch is disabled (SDK_GENERATOR_DISPATCH_TOKEN is empty); skipping"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SDK_GENERATOR_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lbacik/jsonhub-sdk-generator/dispatches \
            -d "$(jq -nc --arg version "$SOURCE_API_VERSION" '{event_type: "api-release", client_payload: {product: "paysubscriptions", source_api_version: $version}}')"
