name: Release image

on:
  push:
    tags:
      - 'v*'

# Images go to the private registry on rum rather than ghcr.io: this repository
# is private, the rest of the suite (jsonhub/*, gprodb/pages-api) already
# publishes here, and it keeps the images off GitHub's package storage entirely.
env:
  REGISTRY: registry.rum.luka.sh
  IMAGE_NAME: paysubscriptions/web

jobs:
  # The gate. The same workflow that runs on every branch push, so a tag whose
  # checks are red never produces an image and therefore never reaches deploy.yml.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # REGISTRY_USER and REGISTRY_PASSWORD are scoped to the `production`
    # environment, and environment secrets are invisible to a job that does not
    # name the environment - without this line the login step below would receive
    # two empty strings and the tag would die here having built nothing.
    #
    # The consequence to know about: this also puts the *image build* behind any
    # deployment protection rule (required reviewers, wait timer) later added to
    # the environment. Moving the two registry secrets to repository scope is what
    # would separate "approve the deploy" from "build the image"; see the notes in
    # deploy.yml.
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The Dockerfile has a single stage (php:8.4-apache), so there is no
      # `target:` to select - unlike the multi-stage images elsewhere in the suite.
      #
      # A single platform: `docker --context rum info` reports x86_64, and
      # building the arm64 half would double the build for an image nothing pulls.
      #
      # The provenance and SBOM attestations ride inside the image index and land
      # in the registry with it. There is deliberately no
      # actions/attest-build-provenance step on top: GitHub's attestation store
      # rejects writes from user-owned private repositories.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    # Required for the reusable workflow to see the production environment's
    # secrets - a called workflow inherits none of them by default.
    secrets: inherit
