# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    docsPath: '%kernel.project_dir%/resources/docs/'
    systemEmail: '%env(SYSTEM_EMAIL)%'
    contactEmail: '%env(CONTACT_EMAIL)%'
    mailingProviderRoutingKey: '%env(MAILING_PROVIDER_ROUTING_KEY)%'
    google_recaptcha_site_key: '%env(GOOGLE_RECAPTCHA_SITE_KEY)%'
    google_recaptcha_secret: '%env(GOOGLE_RECAPTCHA_SECRET)%'
    # Public identifier of this authorization server, carried as the `iss`
    # claim of every access token and enforced by the API resource server.
    app.oauth2.issuer: '%env(OAUTH2_ISSUER)%'
    # OAuth2 token lifetimes, defined once here (issue #135, problem 6). The
    # League bundle config references these parameters and code that needs
    # the values gets them injected, so no lifetime is repeated in both
    # config and App\OAuth2 constants.
    app.oauth2.access_token_ttl: 'PT15M'
    app.oauth2.refresh_idle_ttl: 'P30D'
    app.oauth2.clock_skew_leeway: 'PT60S'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $docsPath: '%docsPath%'
            $systemEmail: '%systemEmail%'
            $contactEmail: '%contactEmail%'
            $jsonHubProjectUuid: '%env(JSON_HUB_PROJECT)%'
            $mailingProviderRoutingKey: '%mailingProviderRoutingKey%'
            $recaptchaSecret: '%google_recaptcha_secret%'


    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Restored manually: symfony/framework-bundle's recipe no longer ships
        # this exclude list, but we need it kept out of the container.
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    # Web-login throttling (issue #143): the bundle's own username+IP *and*
    # IP limiters, fed by the env-sized login_local/login_global factories
    # (config/packages/rate_limiter.yaml) instead of the static max_attempts
    # the firewall schema would otherwise require.
    app.login_throttling.limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_global'
            $localFactory: '@limiter.login_local'
            $secret: '%kernel.secret%'

    App\Service\RecaptchaVerifierInterface: '@App\Service\RecaptchaVerifier'

    # Tenant-aware SES v2 transport for MAILER_DSN=ses+tenant://KEY:SECRET@default
    # (all application email; see App\Mailer\SesTenantTransport).
    App\Mailer\SesTenantTransportFactory:
        tags: ['mailer.transport_factory']

    # Reads the paysubs SES recipient-restriction queue as the dedicated
    # paysubs-feedback-reader IAM user (aws-config PaysubsSesTenantStack).
    app.ses_restriction_sqs_client:
        class: AsyncAws\Sqs\SqsClient
        arguments:
            $configuration:
                region: !php/const App\Mailer\SesTenantBoundary::REGION
                accessKeyId: '%env(SES_RESTRICTION_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(SES_RESTRICTION_SECRET_ACCESS_KEY)%'

    # OAuth2 API v1 wiring (issues #88, #91). The listeners self-register
    # through #[AsEventListener]; the repository decorators and the resource
    # server swap need explicit definitions below.
    # RFC 7009 revocation (issue #92) decrypts opaque client-facing refresh
    # tokens with the same authorization-server encryption key the bundle
    # uses (see League's EncryptionKeyPass for the plain/defuse switch).
    App\OAuth2\OpaqueTokenDecryptor:
        arguments:
            $encryptionKey: '%league.oauth2_server.encryption_key%'
            $encryptionKeyType: '%league.oauth2_server.encryption_key.type%'

    App\OAuth2\ApiAccessTokenRepository:
        decorates: 'league.oauth2_server.repository.access_token'
        arguments:
            $inner: '@App\OAuth2\ApiAccessTokenRepository.inner'
            $issuer: '%app.oauth2.issuer%'
            # Key identifier carried in the `kid` header of every new access
            # token (issue #94). Empty means legacy mode: no `kid` header.
            $keyId: '%env(OAUTH_KEY_ID)%'

    # Refresh-token families (issue #91): single-use rotation, replayed-token
    # revocation, and the 30-day idle / 90-day absolute family deadlines.
    App\OAuth2\RefreshTokenFamilyRepository:
        decorates: 'league.oauth2_server.repository.refresh_token'
        arguments:
            $inner: '@App\OAuth2\RefreshTokenFamilyRepository.inner'
            $refreshIdleTtl: '%app.oauth2.refresh_idle_ttl%'

    # Single definition of the OAuth2 token lifetimes (issue #135, problem 6):
    # the bundle config references the same parameters, and the rotation
    # overlap derives from them here instead of being hard-coded.
    App\OAuth2\OAuthTokenLifetimes:
        # Public so the overlap window stays inspectable (tests, runbooks)
        # even though no runtime service injects the whole object yet.
        public: true
        arguments:
            $accessTokenTtl: '%app.oauth2.access_token_ttl%'
            $refreshIdleTtl: '%app.oauth2.refresh_idle_ttl%'
            $clockSkewLeeway: '%app.oauth2.clock_skew_leeway%'

    # Signing-key rotation (issue #94): the resource server verifies against
    # the current public key plus, while a rotation is in flight, the previous
    # one selected by the token's `kid` header. The previous key arrives as a
    # raw env string (path or contents, like the bundle's own key settings)
    # and is only loaded when non-empty, so deployments without a rotation in
    # flight configure nothing. Dropping it ends the old key immediately.
    App\OAuth2\ApiResourceServer:
        arguments:
            $accessTokenRepository: '@league.oauth2_server.repository.access_token'
            $publicKey: '@app.oauth2.resource_public_key'
            $issuer: '%app.oauth2.issuer%'
            $keyId: '%env(OAUTH_KEY_ID)%'
            $previousPublicKey: '%env(OAUTH_PREVIOUS_PUBLIC_KEY)%'
            $previousKeyId: '%env(OAUTH_PREVIOUS_KEY_ID)%'
            $clockSkewLeeway: '%app.oauth2.clock_skew_leeway%'
    League\OAuth2\Server\ResourceServer: '@App\OAuth2\ApiResourceServer'

    # Public verification key for the API resource server. The permission
    # check is disabled on purpose: league's heuristic targets private keys,
    # while a public key is world-readable (644) by design. A misplaced
    # private key would still be caught by the authorization server wiring.
    app.oauth2.resource_public_key:
        class: League\OAuth2\Server\CryptKey
        arguments:
            $keyPath: '%env(resolve:OAUTH_PUBLIC_KEY)%'
            $passPhrase: ~
            $keyPermissionsCheck: false

    # Discovery publishes this same public key as a JWK Set (issue #90). Only
    # the public key is ever wired here, so private material cannot leak.
    App\OAuth2\JwksProvider:
        arguments:
            $publicKeyPath: '%env(resolve:OAUTH_PUBLIC_KEY)%'
