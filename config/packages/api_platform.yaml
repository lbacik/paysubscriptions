api_platform:
    title: PaySubscriptions API
    version: 1.0.0
    description: Versioned REST API for User-owned resources (v1).
    mapping:
        paths:
            - '%kernel.project_dir%/src/ApiResource'
    # HAL is the default (first) format: JSON-LD's @-members collide with the
    # resources' own `id` in generated clients. Plain JSON collections are
    # bare arrays without pagination metadata. JSON:API is not enabled. See
    # ADR 0007.
    formats:
        jsonhal: ['application/hal+json']
        json: ['application/json']
        jsonld: ['application/ld+json']
    # Every error is application/problem+json whatever the Accept: HAL has no
    # error normalizer and would fall back to a JSON-LD Hydra error.
    error_formats:
        jsonproblem: ['application/problem+json']
    path_segment_name_generator: api_platform.metadata.path_segment_name_generator.dash
    defaults:
        route_prefix: /v1
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    # OAuth2 for the generated document and Swagger UI (issues #258, #260).
    # The scheme documents the authorization-code + S256 PKCE flow every API
    # v1 caller uses; Swagger UI signs in with the dedicated public Client
    # `paysubscriptions-api-docs` (a public client id is not a secret, so it
    # is hard-coded here, not an env var). Relative URLs keep the committed
    # snapshot host-agnostic. `persist_authorization` stays false (the
    # default): no bearer token in localStorage on a public page.
    oauth:
        enabled: true
        type: oauth2
        flow: authorizationCode
        clientId: paysubscriptions-api-docs
        clientSecret: ''
        tokenUrl: /token
        authorizationUrl: /authorize
        pkce: true
        scopes:
            'api:full': 'Full read/write access to the approving User''s data.'
