security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            # _profiler and _wdt routes are only registered when@dev (see
            # config/routes/web_profiler.yaml), so this pattern is already
            # unreachable outside dev regardless of the bypass below.
            pattern: ^/(_profiler|_wdt)/
            security: false
        assets:
            # Static assets must stay reachable for anonymous visitors in every
            # environment, so this can't be limited to dev like the firewall
            # above. Scoped to AssetMapper's public prefix only - `/build/` came
            # from the symfony/security-bundle recipe update but this app never
            # adopted Encore, so no such directory or route exists to protect.
            pattern: ^/assets/
            security: false
        oauth2_token:
            # The OAuth2 token and revocation endpoints must stay reachable
            # without a session: public clients exchange authorization codes
            # here with PKCE only and revoke refresh tokens with client_id.
            pattern: ^/(token|revoke)$
            security: false
        api:
            # Bearer-token API boundary, separate from the session-based web
            # login in `main`. Stateless so no session is ever created from an
            # API request; the bundle's oauth2 authenticator validates the
            # signed access token (App\OAuth2 additionally enforces the API
            # audience and issuer claim).
            pattern: ^/api
            stateless: true
            oauth2: true
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppCustomAuthenticator
            user_checker: App\Security\UserChecker
            # Brute-force protection (issue #143): at most LOGIN_MAX_ATTEMPTS
            # failed logins per account+IP inside the window (plus a
            # LOGIN_MAX_ATTEMPTS_IP per-IP ceiling). Further attempts — even
            # with the right password — fail with a TooManyLoginAttempts
            # message rendered on the login page. The bursts resolve from the
            # environment (see config/packages/rate_limiter.yaml): the test
            # suite pins them to opt in per test. A custom limiter service is
            # used because the bundle computes its default 1:5 ratio from
            # max_attempts while compiling the container, which cannot consume
            # an env placeholder.
            login_throttling:
                limiter: app.login_throttling.limiter
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route
                # Logout changes state, so it must not be a plain GET any
                # third-party page can trigger: every logout request carries
                # a per-session CSRF token (see the logout forms in the UI).
                enable_csrf: true
                csrf_token_id: logout
                csrf_parameter: _csrf_token

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # OAuth2 authorization reuses the existing web login: anonymous Users
        # are sent to /login first, and the full authorize URL (including the
        # OAuth query) is restored as the post-login target.
        - { path: ^/authorize$, roles: ROLE_USER }
        # The API is deny-by-default: a request without a Bearer token skips
        # the OAuth2 authenticator entirely, so without this rule anonymous
        # traffic would fall through to the resource (issue #88). Every /api
        # caller — including docs and entrypoint — presents a User-delegated
        # token; sibling issues carve out anything that must stay public.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
