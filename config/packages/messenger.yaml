framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: 'doctrine://default?auto_setup=0'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 5
                    delay: 10000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

            # Newsletter signups: the worker's MailingSubscribeHandler
            # subscribes the address through the self-hosted listmonk API.
            App\Message\MailingSubscribe: async

when@dev:
    framework:
        messenger:
            transports:
                sync: 'sync://'
            routing:
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync

when@test:
    framework:
        messenger:
            routing:
                # Emails send synchronously in tests (as in dev), so no
                # messenger_messages table is needed and nothing leaks between
                # tests: MailerAssertionsTrait observes every sent email.
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
