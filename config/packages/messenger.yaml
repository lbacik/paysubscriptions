framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: 'doctrine://default?auto_setup=0'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'
            newsletter:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
                options:
                    exchange:
                        name: mailing
                        type: direct
                        default_publish_routing_key: '%mailingProviderRoutingKey%'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

            App\Message\MailingSubscribe: newsletter

when@dev:
    framework:
        messenger:
            transports:
                sync: 'sync://'
            routing:
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync

when@test:
    framework:
        messenger:
            transports:
                # `newsletter` is the only consumer of MESSENGER_TRANSPORT_DSN, and
                # the `exchange` options block above is AMQP-only: point it at a
                # doctrine:// DSN and the Doctrine transport factory rejects
                # `exchange`, killing any command that instantiates the transport.
                # Overriding the DSN here means the test suite never depends on
                # what that variable happens to hold - the in-memory transport
                # ignores options it does not recognise, so the block is inert.
                #
                # Only the dsn key is overridden; Symfony merges this onto the base
                # definition, so serializer/retry_strategy/options still apply.
                #
                # Not merely tidiness: the PHPUnit step in test.yml inherits that
                # job's doctrine:// value, and passes today only because the suite
                # is empty. The first test that creates the test schema or
                # dispatches MailingSubscribe would hit the failure above.
                newsletter: 'in-memory://'
            routing:
                # Emails send synchronously in tests (as in dev), so no
                # messenger_messages table is needed and nothing leaks between
                # tests: MailerAssertionsTrait observes every sent email.
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
