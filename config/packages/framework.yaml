# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Symfony 8 default: the constructor extractor feeds PropertyInfo, so
    # constructor-promoted values stay visible to serializers and forms.
    property_info:
        with_constructor_extractor: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Scoped client for the self-hosted listmonk API (newsletter signups).
    # listmonk authenticates with `Authorization: token USER:TOKEN`.
    http_client:
        scoped_clients:
            listmonk.client:
                base_uri: '%env(LISTMONK_URL)%'
                headers:
                    Authorization: 'token %env(LISTMONK_API_USER)%:%env(LISTMONK_API_TOKEN)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
