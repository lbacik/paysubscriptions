when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true

when@test:
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true
        orm:
            reset:
                # Schema mode runs doctrine:schema:update, which is broken in
                # this repo: the messenger doctrine transports register a
                # schema listener requiring a DBAL 4.5+ API while DBAL 3 is
                # installed. Migrate mode replays doctrine:migrations:migrate
                # instead, which is also what CI verifies against production.
                mode: migrate
