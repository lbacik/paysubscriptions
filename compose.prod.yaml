# Production stack for rum (https://paysubscriptions.com).
#
# Deployed from CI against a remote daemon, so compose reads this file and the
# environment locally while the containers run on the target host:
#
#   DOCKER_HOST=ssh://rum docker compose --env-file /dev/null \
#     -f compose.prod.yaml -p paysubscriptions up -d --pull always --wait
#
# --env-file /dev/null is load-bearing. Without it compose reads the repo's
# committed .env, where APP_SECRET is empty, DATABASE_URL is
# postgresql://app:!ChangeMe!@127.0.0.1:5432/app and MAILER_DSN is null://null -
# so every ${VAR:?} guard below would resolve to a dev value and the deploy
# would come up silently misconfigured instead of failing loudly.
#
# The project name is always passed explicitly with -p; nothing here relies on
# COMPOSE_PROJECT_NAME (which .env.docker.rum sets to ps-${TAG}).
#
# This is deliberately NOT a copy of compose.yaml, which is the dev file:
#
#   - `build: .` and `image: ps-web-${TAG}` become ${APP_IMAGE}, a digest-stable
#     tag pulled from the private registry (REGISTRY_HOST). Production never builds on the host.
#   - the `database` (postgres) service is gone. Production talks to the shared
#     external MySQL on `my.rum`, reached over the external `main` network, so a
#     postgres container here would be an unused second database.
#   - the `mailcatcher` service is gone. Production mail goes out over MAILER_DSN.
#   - `worker` runs `messenger:consume async` from the same image as `web`.
#     Nothing else drains that transport: lbacik/mailing-workers consumes only
#     the AMQP `mailing` exchange that MESSENGER_TRANSPORT_DSN points at.
#     `restriction-consumer` runs `app:ses:consume-recipient-restrictions`,
#     also from that image, and is the only service with SQS credentials.
#   - APP_ENV and APP_DEBUG are fixed here rather than passed in, so a stray
#     APP_ENV=dev in the deploy environment cannot put production into debug mode.
#     Note .env.docker.rum pins APP_ENV=dev - that file describes the *staging*
#     deployment this stack replaces, not this one.
#   - APP_SECRET is passed, which compose.yaml never did: a container started
#     from compose.yaml runs on the empty APP_SECRET committed in .env, which
#     silently weakens every signed URL the reset-password and verify-email
#     bundles issue.
#   - SYSTEM_EMAIL, CONTACT_EMAIL and DEFAULT_URI are passed, which compose.yaml
#     also never did, even though config/services.yaml and config/packages/
#     read all three via %env()%. They too were resolving from committed .env.

networks:
  default:
    name: "${NETWORK:-main}"
    external: true

# Shared by web and worker: both boot the same kernel from the same image, so
# both need everything the container compiles against. Only web adds the
# nginx-proxy discovery variables - the worker must never be routed to.
x-app-environment: &app-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: "${APP_SECRET:?APP_SECRET is required}"
  # Rendered into every page by config/packages/twig.yaml as `appVersion`.
  # Supplied by the deploy job from the tag, not by an environment variable.
  APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
  # Self-hosted Umami tracker, rendered by templates/_analytics.html.twig.
  # Public values, from the production environment's variables.
  UMAMI_SCRIPT_URL: "${UMAMI_SCRIPT_URL:?UMAMI_SCRIPT_URL is required}"
  UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:?UMAMI_WEBSITE_ID is required}"
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
  MAILER_DSN: "${MAILER_DSN:?MAILER_DSN is required}"
  MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN:?MESSENGER_TRANSPORT_DSN is required}"
  # What Symfony uses to build absolute URLs outside an HTTP request - the
  # links in the verify-email and reset-password messages, and anything
  # bin/console generates. APP_URL, which compose.yaml passes, is not set
  # here on purpose: nothing in config/ or src/ reads it, DEFAULT_URI is the
  # one that matters.
  DEFAULT_URI: "${DEFAULT_URI:-https://paysubscriptions.com}"
  SYSTEM_EMAIL: "${SYSTEM_EMAIL:?SYSTEM_EMAIL is required}"
  CONTACT_EMAIL: "${CONTACT_EMAIL:?CONTACT_EMAIL is required}"
  # Both are compile-time container parameters (config/services.yaml), so
  # the container will not boot at all if either is missing - hence :? even
  # though neither is a credential.
  JSON_HUB_PROJECT: "${JSON_HUB_PROJECT:?JSON_HUB_PROJECT is required}"
  MAILING_PROVIDER_ROUTING_KEY: "${MAILING_PROVIDER_ROUTING_KEY:?MAILING_PROVIDER_ROUTING_KEY is required}"
  # Read as %env(bool:MAINTENANCE_MODE)% by MaintenanceKernelRequestSubscriber.
  # Defaulted rather than required so a deploy cannot accidentally serve the
  # maintenance page because a variable went missing.
  MAINTENANCE_MODE: "${MAINTENANCE_MODE:-0}"
  GOOGLE_RECAPTCHA_SITE_KEY: "${GOOGLE_RECAPTCHA_SITE_KEY:?GOOGLE_RECAPTCHA_SITE_KEY is required}"
  GOOGLE_RECAPTCHA_SECRET: "${GOOGLE_RECAPTCHA_SECRET:?GOOGLE_RECAPTCHA_SECRET is required}"
  # OAuth2 signing and encryption material (issue #94, procedures in
  # docs/oauth-key-rotation.md, full operator runbook in
  # docs/api-operations.md). Values are container-local: either paths
  # to key files baked or mounted into the image, or the raw PEM/key
  # contents inline. Required since the API v1 release gates (#100):
  # without them the authorization, token, JWKS, and API endpoints
  # cannot work, and the deploy must fail loudly instead of converging
  # a stack whose API is silently dead. The preflight in deploy.yml
  # rejects missing values before anything is pulled, and
  # app:api:preflight re-checks them from inside the container.
  OAUTH_PRIVATE_KEY: "${OAUTH_PRIVATE_KEY:?OAUTH_PRIVATE_KEY is required}"
  OAUTH_PUBLIC_KEY: "${OAUTH_PUBLIC_KEY:?OAUTH_PUBLIC_KEY is required}"
  OAUTH_ENCRYPTION_KEY: "${OAUTH_ENCRYPTION_KEY:?OAUTH_ENCRYPTION_KEY is required}"
  # Private-key passphrase. Optional by design: empty when the signing
  # key has none, which is the recommended production setup.
  OAUTH_PASSPHRASE: "${OAUTH_PASSPHRASE:-}"
  # Key identifier minted into every access token's `kid` header. Change
  # to a fresh label with each signing-key rotation; keep in step with
  # whichever key the *_KEY paths above point at.
  OAUTH_KEY_ID: "${OAUTH_KEY_ID:-v1}"
  # Previous verification key while a routine rotation is in flight;
  # empty the rest of the time (and always after an emergency rotation).
  OAUTH_PREVIOUS_PUBLIC_KEY: "${OAUTH_PREVIOUS_PUBLIC_KEY:-}"
  OAUTH_PREVIOUS_KEY_ID: "${OAUTH_PREVIOUS_KEY_ID:-}"
  # Public identifier carried as the `iss` claim of every access token.
  # Should match the production base URL so tokens are self-describing.
  OAUTH2_ISSUER: "${OAUTH2_ISSUER:-https://paysubscriptions.com}"

# The consumers have no port to probe, but they cannot go without a healthcheck:
# the image's HEALTHCHECK NONE is a healthcheck config (test ["NONE"]), not the
# absence of one, so `up --wait` finds no health state to wait on and fails
# with "container ... has no healthcheck configured". `healthcheck: disable`
# writes the same ["NONE"] and fails the same way.
#
# A no-op probe instead: the container turns healthy on the first check, one
# interval after start, so `up --wait` proves it stayed up past kernel boot -
# a consumer that cannot boot exits before that and fails the deploy there.
x-consumer-healthcheck: &consumer-healthcheck
  test: ["CMD", "php", "-r", "exit(0);"]
  interval: 10s
  timeout: 5s
  retries: 3

services:
  web:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: paysubscriptions-web
    restart: "${RESTART:-unless-stopped}"
    environment:
      <<: *app-environment
      # nginx-proxy / acme-companion discovery. VIRTUAL_PORT is explicit because
      # the FrankenPHP image exposes four ports (80, 443, 443/udp and Caddy's
      # admin API on 2019); with more than one exposed port nginx-proxy falls
      # back to a guess rather than inferring, as it could under php:8.4-apache,
      # which exposed 80 alone. The Dockerfile pins SERVER_NAME=:80, so 80 is the
      # only one of the four that is actually listening.
      VIRTUAL_PORT: "80"
      VIRTUAL_HOST: "${VIRTUAL_HOST:-paysubscriptions.com}"
      LETSENCRYPT_HOST: "${LETSENCRYPT_HOST:-${VIRTUAL_HOST:-paysubscriptions.com}}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    healthcheck:
      # Kept on php rather than the curl the FrankenPHP image now ships: php is
      # guaranteed present whatever the base, and this probe is not worth coupling
      # to the runtime image's package list. `/` is enough for a liveness check -
      # it proves Caddy, the php_server fallback to public/index.php and a warm
      # prod container. Whether the *database* is reachable is proven
      # separately by deploy.yml's smoke test, because no public GET route in
      # this app queries it.
      test: [
        "CMD", "php", "-r",
        "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous: the first request after a deploy warms the prod container and
      # compiles Doctrine proxies into %kernel.build_dir%.
      start_period: 60s

  # Drains the `async` transport (doctrine://default, the messenger_messages
  # table), which is where every SendEmailMessage goes in prod - so this is
  # what actually hands mail to MAILER_DSN, and where the recipient-restriction
  # check runs at send time. Without it, mail queues and never leaves.
  #
  # --time-limit and --memory-limit make it exit cleanly every hour or once it
  # grows; the restart policy brings it straight back, which also picks up a
  # fresh kernel. Messages that exhaust the retry strategy land in the `failed`
  # transport: `bin/console messenger:failed:show` lists them.
  worker:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: paysubscriptions-worker
    restart: "${RESTART:-unless-stopped}"
    command:
      - ./bin/console
      - messenger:consume
      - async
      - --time-limit=3600
      - --memory-limit=128M
      - --no-interaction
    environment:
      <<: *app-environment
    # messenger:consume finishes the message in hand on SIGTERM (pcntl, see the
    # Dockerfile). A mail send is seconds at most; this is headroom on top.
    stop_grace_period: 30s
    healthcheck: *consumer-healthcheck

  # Drains the paysubs-ses-recipient-restrictions SQS queue into
  # recipient_restriction, so the send-time check in `worker` knows which
  # addresses SES reported as permanent bounces or complaints. It is the only
  # service that gets the paysubs-feedback-reader keys.
  #
  # Like `worker`, it exits every hour and the restart policy brings it back;
  # an SQS error it cannot handle (rejected keys, wrong queue URL) also exits
  # it, and deploy.yml's consumer check reports the restart. A message is
  # deleted only after its restriction is committed, so a kill mid-batch just
  # means SQS redelivers it, and recording a restriction again is a no-op.
  restriction-consumer:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: paysubscriptions-restriction-consumer
    restart: "${RESTART:-unless-stopped}"
    command:
      - ./bin/console
      - app:ses:consume-recipient-restrictions
      - --time-limit=3600
      - --no-interaction
    environment:
      <<: *app-environment
      SES_RESTRICTION_QUEUE_URL: "${SES_RESTRICTION_QUEUE_URL:?SES_RESTRICTION_QUEUE_URL is required}"
      SES_RESTRICTION_ACCESS_KEY_ID: "${SES_RESTRICTION_ACCESS_KEY_ID:?SES_RESTRICTION_ACCESS_KEY_ID is required}"
      SES_RESTRICTION_SECRET_ACCESS_KEY: "${SES_RESTRICTION_SECRET_ACCESS_KEY:?SES_RESTRICTION_SECRET_ACCESS_KEY is required}"
    # The command installs no signal handler, and as PID 1 PHP would ignore
    # SIGTERM until the 10 s kill. A tiny init forwards it, so the default
    # action - exit - happens at once; the paragraph above is why that is safe.
    init: true
    healthcheck: *consumer-healthcheck

